# Default values for the app chart.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: harbor.example.com/my-project/my-app
  pullPolicy: IfNotPresent
  # Overridden by the image tag generated by `go_image`
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext: {}

securityContext:
  runAsNonRoot: true
  runAsUser: 10001
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL

service:
  type: ClusterIP
  grpcPort: 8080
  httpPort: 8081

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

resources:
  limits:
    cpu: 200m
    memory: 128Mi
  requests:
    cpu: 100m
    memory: 64Mi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

# For mounting secrets from AWS Secrets Manager via the External Secrets Operator (ESO)
# or the AWS Secrets Store CSI Driver.
# See README.md for more details.
volumes: []
# - name: db-secret
#   secret:
#     secretName: db-credentials

volumeMounts: []
# - name: db-secret
#   mountPath: "/mnt/secrets"
#   readOnly: true

nodeSelector: {}
tolerations: []
affinity: {}
