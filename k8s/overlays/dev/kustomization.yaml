apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# The helm_template output will be automatically included by the kustomize_build rule.

# Example of patching the user-api deployment to add the DATABASE_URL
# This demonstrates how to integrate with the External Secrets Operator (ESO).
# The 'db-credentials' secret would be created by an ExternalSecret resource.
patches:
  - patch: |-
      - op: add
        path: /spec/template/spec/containers/0/envFrom
        value:
          - secretRef:
              name: db-credentials
    target:
      kind: Deployment
      name: user-api

# Helm values for the dev environment
helmCharts:
  - name: app
    releaseName: user-api
    version: 0.1.0
    valuesFile: values-user-api.yaml
  - name: app
    releaseName: product-api
    version: 0.1.0
    valuesFile: values-product-api.yaml
